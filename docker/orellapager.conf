# Apache virtual hosts, mirroring /etc/httpd/conf/httpd.conf and
# /etc/httpd/conf/httpd-le-ssl.conf on the droplet.

<VirtualHost *:80>
    ServerName orellapager.me
    ServerAlias www.orellapager.me orellapager
    DocumentRoot /var/www/html

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =www.orellapager.me [OR]
    RewriteCond %{SERVER_NAME} =orellapager.me [OR]
    RewriteCond %{SERVER_NAME} =orellapager
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName orellapager.me
    ServerAlias www.orellapager.me orellapager
    DocumentRoot /var/www/html

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/orellapager.me/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/orellapager.me/privkey.pem
</VirtualHost>
